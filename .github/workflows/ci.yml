name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # dotpm's source is a pinned submodule; build-time code and tests compile against it.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dotpm (vendor/obsidian-pm)
        working-directory: vendor/obsidian-pm
        run: npx --yes pnpm@11 install --frozen-lockfile --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - name: Verify the committed viewer matches the pinned dotpm
        run: |
          npm run build:viewer
          git diff --exit-code -- src/generated
      - name: Verify the committed dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: Verify dist externals
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
          const peerDeps = Object.keys(pkg.peerDependencies || {});
          const builtins = new Set(require('module').builtinModules);
          const shared = ['@quartz-community/', 'preact', '@jackyzha0/quartz', 'vfile', 'unified'];
          const re = /^\s*(?:import\s+.*\s+from|export\s+.*\s+from)\s+[\"']([^\"'./][^\"']*)[\"']/gm;
          const unexpected = new Set();
          for (const dist of ['dist/index.js', 'dist/components/index.js']) {
            for (const m of fs.readFileSync(dist, 'utf-8').matchAll(re)) {
              const s = m[1];
              const bare = s.startsWith('@') ? s.split('/').slice(0, 2).join('/') : s.split('/')[0];
              if (s.startsWith('node:') || builtins.has(bare)) continue;
              if (shared.some((p) => s.startsWith(p))) continue;
              if (peerDeps.some((d) => s === d || s.startsWith(d + '/'))) continue;
              unexpected.add(s);
            }
          }
          if (unexpected.size > 0) {
            console.error('dist/ has unbundled imports that will fail at runtime:', [...unexpected]);
            process.exit(1);
          }
          console.log('dist/ externals verified.');
          "
